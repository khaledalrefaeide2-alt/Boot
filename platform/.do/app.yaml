# =============================================================================
# مواصفة تطبيق DigitalOcean App Platform
#
#   الاستيراد:  Apps ← Create ← "Import from App Spec" ثم الصق هذا الملف،
#               أو  doctl apps create --spec platform/.do/app.yaml
#
# ملف مرجعي لا نهائي: أسماء أحجام النسخ ومحرّكات القواعد تتغيّر عند المزوّد،
# والحقول المعلّمة بـ «تحقّق» تُراجع في اللوحة قبل الاستيراد.
#
# لا سرّ في هذا الملف. القيم السرّية تُترك فارغة وتُملأ في لوحة التطبيق
# بنوع SECRET، فتُخزَّن مشفّرة ولا تظهر بعد الحفظ.
#
# ★ الملف غير قابل للتنفيذ كما هو. قبل استيراده يلزم:
#     ١) إنشاء عنقود PostgreSQL باسم  media-monitoring-db
#     ٢) إنشاء عنقود Valkey باسم      media-monitoring-cache
#     ٣) تعبئة القيم السرّية الفارغة في اللوحة بعد الاستيراد
#   الاستيراد قبل (١) و(٢) يفشل، والنشر قبل (٣) يقلع بإعدادات ناقصة.
# =============================================================================
name: media-monitoring

# تحقّق: اختر المنطقة الأقرب لمستخدميك — fra = فرانكفورت
region: fra

services:
  - name: web
    # ★ جذر المشروع ليس جذر المستودع
    source_dir: platform
    dockerfile_path: platform/Dockerfile
    github:
      repo: khaledalrefaeide2-alt/Boot
      branch: claude/social-media-monitoring-platform-45iz0q
      deploy_on_push: true

    # أمر صريح لا الافتراضي: نقطة الدخول في الصورة تطبّق الترحيلات والبذر عند
    # الإقلاع (وهو المناسب لـ docker compose)، وهنا لكل منهما مكوّن مستقل.
    run_command: npm run start:prod

    instance_count: 1
    # الحجم الثابت 1 GiB — أرخص من apps-s-1vcpu-1gb بالسعر المرن لنفس الذاكرة
    instance_size_slug: apps-s-1vcpu-1gb-fixed

    http_port: 8080
    health_check:
      http_path: /api/health
      initial_delay_seconds: 40
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 5

    envs:
      # PORT تحقنه المنصة تلقائياً، والمشغّل يقرأه. لا حاجة لضبط APP_PORT.
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production

      # RUN_TIME لا BUILD:
      #   البناء يحتاج قيمتَي DATABASE_URL و SESSION_SECRET ليجتاز التحقق في
      #   src/lib/env.ts، لكنه لا يتصل بشيء — و Dockerfile يوفّرهما بقيم وهمية
      #   داخل أمر RUN نفسه. فأسرار الإنتاج لا تدخل مرحلة البناء إطلاقاً.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
        value: '' # ← املأه في اللوحة:  openssl rand -base64 48

      - key: REDIS_URL
        scope: RUN_TIME
        value: ${cache.DATABASE_URL}

      # عنوان التطبيق العلني — بدونه يبقى الافتراضي localhost فيُرفض كل دخول
      - key: APP_URL
        scope: RUN_TIME
        value: ${APP_URL}

      # شهادة سلطة تصديق القاعدة المُدارة — تُنسخ من لوحة القاعدة
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
        value: ''

      - key: APIFY_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ''
      - key: SESSION_TTL_DAYS
        scope: RUN_TIME
        value: '7'

workers:
  - name: worker
    source_dir: platform
    dockerfile_path: platform/Dockerfile
    github:
      repo: khaledalrefaeide2-alt/Boot
      branch: claude/social-media-monitoring-platform-45iz0q
      deploy_on_push: true

    run_command: npm run worker:prod

    # ★ نسخة واحدة لا أكثر: الجدولة الدورية مؤقّت داخل العملية لا مهمة طابور،
    # فكل نسخة إضافية تكرّر جدولة الحسابات المستحقة كل دقيقة.
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed

    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ''
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${cache.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
        value: ''
      - key: APIFY_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ''
      - key: WORKER_CONCURRENCY
        scope: RUN_TIME
        value: '2'

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    source_dir: platform
    dockerfile_path: platform/Dockerfile
    github:
      repo: khaledalrefaeide2-alt/Boot
      branch: claude/social-media-monitoring-platform-45iz0q

    # ★ أول نشر: bootstrap — يطبّق الترحيلات ثم يبذر البيانات الأولية،
    #   ويتوقف عند أول فشل ولا يبتلعه.
    # ★ بعد نجاح التهيئة الأولى غيّره إلى:  npm run deploy:migrate
    #   (البذر idempotent فلا يُفسد شيئاً بتكراره، لكن إبقاءه يُطيل كل نشر
    #    بلا فائدة ويُبقي أسرار المالك مطلوبة في بيئة المهمة.)
    run_command: npm run deploy:bootstrap

    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed

    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ''
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
        value: ''
      # تُملأ لأول نشر فقط مع deploy:bootstrap، ثم تُفرَّغ
      - key: SEED_OWNER_EMAIL
        scope: RUN_TIME
        value: ''
      - key: SEED_OWNER_NAME
        scope: RUN_TIME
        value: ''
      - key: SEED_OWNER_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ''

databases:
  # ★★ الموردان أدناه يجب أن يكونا **موجودين مسبقاً** في حسابك قبل استيراد
  # هذه المواصفة. الحقل production: true يعني «اربط عنقوداً قائماً» لا
  # «أنشئ واحداً»، و cluster_name هو اسمه الفعلي في لوحة Databases.
  # الاستيراد قبل إنشائهما يفشل بخطأ «cluster not found».
  #
  # name هو الاسم الداخلي في التطبيق ومنه تُشتقّ متغيرات الربط
  # (${db.DATABASE_URL} و ${cache.DATABASE_URL})، فلا يُغيَّر.

  - name: db
    engine: PG
    version: '16'
    production: true
    cluster_name: media-monitoring-db

  - name: cache
    # ★ بعد الإنشاء اضبط سياسة الإخلاء على noeviction:
    #   الطابور يخزّن بيانات المهام هنا، وأي سياسة إخلاء تسمح بحذف مهمة
    #   استخراج منتظرة عند امتلاء الذاكرة فتختفي العملية بلا خطأ ولا أثر.
    #   واستمرارية الطابور عبر إعادة التشغيل مسألة مستقلة تحتاج تحققاً.
    engine: VALKEY
    production: true
    cluster_name: media-monitoring-cache
